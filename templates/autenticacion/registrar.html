{% extends 'base.html' %}

{% block title %}Registrar{% endblock %}

{% block content %}
    <h1>Registrar Nuevo Usuario</h1>
    <hr>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Registrar Usuario</button>
    </form>
{% endblock %}
