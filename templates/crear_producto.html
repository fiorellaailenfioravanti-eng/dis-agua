{% extends 'base.html' %}
{% block title %}Crear Producto{% endblock %}
{% block content %}
    <h1>Crear Nuevo Producto</h1>
        <hr>
        <form method="post" enctype="multipart/form-data">
            <!-- aca traigo la logica del formulario de producto (forms.py y views.py), la primera linea es para la seguridad y la segunda es para los datos-->
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Guardar Producto</button>
{% endblock %}
